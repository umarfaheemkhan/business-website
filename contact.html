
    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roswell Hotel - Contact Us</title>

    <link rel="stylesheet" href="style.css">
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
}

.contact-container {
    width: 80%;
    margin: 60px auto;
    display: flex;
    background: white;
    box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
}
.contact-info {
    width: 40%;
    background: #222;
    color: white;
    padding: 50px 30px;
}

.contact-info h1 {
    font-size: 35px;
    margin-bottom: 20px;
}

.contact-info h2 {
    margin-bottom: 30px;
}

.contact-info p {
    margin: 20px 0;
    font-size: 17px;
}
.contact-form {
    width: 60%;
    padding: 50px;
}

.contact-form h2 {
    margin-bottom: 25px;
    font-size: 28px;
}

.contact-form input,
.contact-form textarea {
    width: 100%;
    padding: 14px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    outline: none;
    font-size: 16px;
}

.contact-form input:focus,
.contact-form textarea:focus {
    border-color: #222;
}

.contact-form button {
    background: #222;
    color: white;
    border: none;
    padding: 14px 30px;
    font-size: 16px;
    cursor: pointer;
}

.contact-form button:hover {
    background: #555;
}
@media (max-width: 768px) {

    .contact-container {
        width: 90%;
        flex-direction: column;
    }

    .contact-info,
    .contact-form {
        width: 100%;
    }

    .contact-form {
        padding: 30px;
    }
}
    </style>
</head>

<body>

    <div class="contact-container">

        <div class="contact-info">
            <h1>Roswell Hotel</h1>
            <h2>Contact Us</h2>

            <p>📍 Gujranwala, Punjab, Pakistan</p>
            <p>📞 +92 3302343950</p>
            <p>✉️ info@Roswellhotel.com</p>
        </div>

        <div class="contact-form">
            <h2>Send Us a Message</h2>

            

<form action="process.php" method="POST" id="contactForm">

    <input
        type="text"
        name="name"
        placeholder="Your Name"
        required
    >

    <input
        type="email"
        name="email"
        placeholder="Your Email"
        required
    >

    <input
        type="tel"
        name="phone"
        placeholder="Your Phone Number"
    >

    <textarea
        name="message"
        placeholder="Write your message..."
        rows="6"
        required
    ></textarea>

    <button type="submit">Send Message</button>

</form>
        </div>

    </div>
    <script>
    document.getElementById("myForm").addEventListener("submit", function (event) {
    event.preventDefault();

    let isValid = true;
    function setError(id, message) {
        document.getElementById(id).textContent = message;
        isValid = false;
    }
    function clearErrors() {
        document.querySelectorAll(".error").forEach(error => {
            error.textContent = "";
        });
    }
    clearErrors();
    const name = document.getElementById("name").value.trim();
    if (name === "") {
        setError("nameError", "Full name is required.");
    } else if (name.length < 3) {
        setError("nameError", "Name must be at least 3 characters long.");
    }
    const email = document.getElementById("email").value.trim();
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (email === "") {
        setError("emailError", "Email is required.");
    } else if (!emailRegex.test(email)) {
        setError("emailError", "Please enter a valid email address.");
    }
    const phone = document.getElementById("phone").value.trim();
    const phoneRegex = /^[0-9]{10,15}$/;

    if (phone === "") {
        setError("phoneError", "Phone number is required.");
    } else if (!phoneRegex.test(phone)) {
        setError("phoneError", "Enter a valid phone number (10–15 digits).");
    }
});
</script>
</body>
</html>
